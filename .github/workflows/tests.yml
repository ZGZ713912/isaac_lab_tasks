name: Project checks

on:
  push:
  pull_request:

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check tracked files and syntax
        run: python tools/check_repository.py

  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/test.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/test.txt
          python -m pip install --no-deps -e .
      - name: Run CPU regressions
        env:
          CUDA_VISIBLE_DEVICES: ""
          MPLBACKEND: Agg
        run: python -m pytest -q --junitxml=outputs/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-test-results
          path: outputs/pytest.xml
